<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Apply tags | Wheel of Dinner</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; background: #140F3A; color: #FFF6E0;
    font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif; line-height: 1.5;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }
  h1 { color: #FFC93C; font-size: 1.6rem; margin: 0 0 0.5rem; }
  p { color: #B9B2E6; margin: 0 0 1rem; }
  button {
    font: inherit; font-weight: 700; border: 0; border-radius: 10px; padding: 0.7rem 1.2rem;
    background: #FFC93C; color: #2A1A00; cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  :focus-visible { outline: 3px solid #FFE9A8; outline-offset: 2px; }
  .table-wrap { overflow-x: auto; margin-top: 1.25rem; }
  table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
  th, td { text-align: left; padding: 0.55rem 0.5rem; border-bottom: 1px solid #3D3390; vertical-align: top; }
  th { color: #B9B2E6; font-weight: 700; }
  .rename { color: #FFC93C; font-size: 0.85rem; display: block; }
  .ok { color: #7EE2A8; font-weight: 700; }
  .err { color: #FF8A95; font-weight: 700; }
  .summary { margin-top: 1rem; font-weight: 700; }
  a { color: #FFC93C; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Apply recipe tags</h1>
  <p>This sets the tags below on your existing recipes and fixes two spelling mistakes. Tags already on these recipes are replaced; ratings, prices and notes are not touched. It's safe to run more than once.</p>
  <button id="go">Apply all tags</button>
  <div class="summary" id="summary" role="status"></div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Recipe</th><th>Tags</th><th>Status</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>
<script>
  const UPDATES = [
    { id: "3eb028d6-262f-434c-bdfc-b6fd2c9093e4", name: "BW3 Garlic Parmesan Chicken Pasta", tags: ["chicken", "pasta", "quick", "kid-friendly"] },
    { id: "29499722-97b8-4da5-95a8-9a880d20afc0", name: "Buffalo Chicken Mac & Cheese", tags: ["chicken", "pasta", "american", "kid-friendly"] },
    { id: "29f0834a-04f3-4df2-a8dc-02036fa77296", name: "Chicken Fajitas", tags: ["chicken", "mexican", "quick"] },
    { id: "28578603-2b9a-4777-803d-ea8a4e353dc7", name: "Southwest Chicken Salad", tags: ["chicken", "mexican", "quick"] },
    { id: "6d3d8bbc-5711-4b2a-bbf8-dd25aa43a25f", name: "Pot Roast", tags: ["beef", "american", "crockpot", "leftovers-friendly"] },
    { id: "438760b1-677e-45c7-8c92-f9043cb96f8e", name: "Mississippi Pot Roast", tags: ["beef", "american", "crockpot", "leftovers-friendly"] },
    { id: "db6cae08-d614-4add-8cab-8c6f73ea7bf1", name: "Grilled Chicken Tacos", tags: ["chicken", "mexican", "grill", "kid-friendly"] },
    { id: "c3b09270-91ab-4901-94d1-78c4dd77fb75", name: "Breakfast Burritos", rename: true, tags: ["breakfast", "mexican", "quick", "kid-friendly"] },
    { id: "9ba8fe09-266e-4afd-b5fa-a2eccf77b633", name: "Asian Crock Pot Chicken and Rice", tags: ["chicken", "asian", "crockpot"] },
    { id: "eb0bd70f-ae45-4290-a892-2c5dc63eb8da", name: "Ground Beef Tacos", tags: ["beef", "mexican", "quick", "kid-friendly"] },
    { id: "bd87446f-d790-4ead-bb80-f35994dde87e", name: "Spaghetti & Meatballs", tags: ["beef", "italian", "pasta", "kid-friendly"] },
    { id: "65324573-7dd0-4eb2-8a1a-707719f0c19e", name: "Buffalo Chicken Wraps", tags: ["chicken", "american", "quick"] },
    { id: "3c233bae-9e7d-4c99-b25a-5ec37a746227", name: "Chicken Alfredo", tags: ["chicken", "italian", "pasta", "kid-friendly"] },
    { id: "af3d83ae-80be-47e3-b9f1-17ea49f7cbbe", name: "Taco Ring", tags: ["beef", "mexican", "quick", "kid-friendly"] },
    { id: "ab6cd32f-b08b-458f-ab72-70c59b30ecd2", name: "French Toast", tags: ["breakfast", "quick", "kid-friendly"] },
    { id: "8195e43f-02ab-432f-8242-1fde2d369848", name: "Baked Turkey & Cheese Sliders", tags: ["american", "quick", "kid-friendly"] },
    { id: "c9610b46-e8b3-4080-8dc2-fe9b2b737e68", name: "Stuffed Shells", tags: ["pork", "italian", "pasta", "leftovers-friendly"] },
    { id: "8066221c-eaa6-41a5-8ed6-48ce2312cbf1", name: "Lasagna", tags: ["beef", "italian", "pasta", "leftovers-friendly"] },
    { id: "2095d209-0cff-45ff-b24e-ddfb7222a0f1", name: "Pulled BBQ Chicken Baked Potatoes", rename: true, tags: ["chicken", "american", "crockpot"] },
    { id: "caedaa07-bec8-4a20-bef0-441da15056a7", name: "Meatball Subs", tags: ["beef", "italian", "kid-friendly"] },
  ];
  const PASS_KEY = "dinnerwheel-passcode";
  const rows = document.getElementById("rows");
  const cells = {};

  for (const u of UPDATES) {
    const tr = document.createElement("tr");
    const name = document.createElement("td");
    name.textContent = u.name;
    if (u.rename) {
      const s = document.createElement("span");
      s.className = "rename"; s.textContent = "Spelling fixed";
      name.append(s);
    }
    const tags = document.createElement("td");
    tags.textContent = u.tags.join(", ");
    const status = document.createElement("td");
    status.textContent = "Waiting";
    tr.append(name, tags, status);
    rows.append(tr);
    cells[u.id] = status;
  }

  const getPass = () => { try { return localStorage.getItem(PASS_KEY) || ""; } catch { return ""; } };
  const setPass = (p) => { try { localStorage.setItem(PASS_KEY, p); } catch {} };

  async function update(u, retried = false) {
    const changes = { tags: u.tags };
    if (u.rename) changes.name = u.name;
    const res = await fetch("/api/recipes", {
      method: "POST",
      headers: { "content-type": "application/json", "x-passcode": getPass() },
      body: JSON.stringify({ action: "update", id: u.id, changes }),
    });
    if (res.status === 401 && !retried) {
      const p = prompt("Enter your household passcode:");
      if (!p) throw new Error("Passcode needed");
      setPass(p.trim());
      return update(u, true);
    }
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.error || `Error ${res.status}`);
    }
  }

  document.getElementById("go").onclick = async (e) => {
    const btn = e.currentTarget;
    btn.disabled = true;
    let done = 0, failed = 0;
    // One at a time, so each change builds on the last saved list.
    for (const u of UPDATES) {
      const cell = cells[u.id];
      cell.textContent = "Saving…"; cell.className = "";
      try {
        await update(u);
        cell.textContent = "Done"; cell.className = "ok"; done++;
      } catch (err) {
        cell.textContent = err.message; cell.className = "err"; failed++;
        if (err.message === "Passcode needed") break;
      }
    }
    const summary = document.getElementById("summary");
    summary.textContent = failed
      ? `${done} updated, ${failed} not updated. Check the messages in the Status column, then try again.`
      : `All ${done} recipes updated. You can go back to the wheel and delete apply-tags.html from GitHub.`;
    if (!failed) {
      const a = document.createElement("a");
      a.href = "/"; a.textContent = " Back to the wheel";
      summary.append(a);
    }
    btn.disabled = false;
  };
</script>
</body>
</html>
